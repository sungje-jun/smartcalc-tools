<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Length Converter - cm, inches, feet, meters</title>
<meta name="description" content="Free length unit converter - Convert between cm, inches, feet, meters, miles, yards instantly.">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="container">
  <header><h1>📏 Length Converter</h1><p>Convert between cm, inches, feet, meters</p></header>
  <div class="ad-slot">Ad Space</div>
  <div class="calc-card">
    <div class="form-group"><label for="val">Value</label><input type="number" id="val" placeholder="100" step="any"></div>
    <div class="form-group"><label for="from">From</label>
      <select id="from" onchange="convert()">
        <option value="cm">Centimeters (cm)</option><option value="m">Meters (m)</option><option value="mm">Millimeters (mm)</option>
        <option value="km">Kilometers (km)</option><option value="in" selected>Inches (in)</option><option value="ft">Feet (ft)</option>
        <option value="yd">Yards (yd)</option><option value="mi">Miles (mi)</option>
      </select>
    </div>
    <button class="btn" onclick="convert()">Convert</button>
    <div class="result-box" id="result"></div>
  </div>
  <div class="ad-slot">Ad Space</div>
  <div class="seo-content"><h2>Common Conversions</h2><ul><li>1 inch = 2.54 cm</li><li>1 foot = 30.48 cm</li><li>1 yard = 91.44 cm</li><li>1 mile = 1.60934 km</li></ul></div>
  <footer><p>SmartCalc.tools — Free Unit Converters</p></footer>
</div>
<script>
var toCm={cm:1,m:100,mm:0.1,km:100000,in:2.54,ft:30.48,yd:91.44,mi:160934};
var names={cm:'cm',m:'m',mm:'mm',km:'km',in:'inches',ft:'feet',yd:'yards',mi:'miles'};
document.getElementById('val').addEventListener('input',convert);
function convert(){var v=parseFloat(document.getElementById('val').value);if(isNaN(v))return;var f=document.getElementById('from').value;var cm=v*toCm[f];var h='<div class="result-highlight">Results</div>';Object.keys(toCm).forEach(function(u){if(u!==f){var r=cm/toCm[u];var d=r<0.01?r.toExponential(2):(r<100?r.toFixed(4):r.toLocaleString('en-US',{maximumFractionDigits:2}));h+='<div class="result-row"><span class="label">'+names[u]+'</span><span class="value">'+d+'</span></div>';}});document.getElementById('result').innerHTML=h;document.getElementById('result').classList.add('show');}
</script>
</body>
</html>
