<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무게 변환 계산기 - kg 파운드 온스 변환</title>
<meta name="description" content="무게 단위 변환기 - kg, 파운드, 온스, 그램, 톤을 즉시 변환합니다.">
<link rel="stylesheet" href="../assets/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8079614247767823" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
  <header><h1>🏋️ 무게 변환</h1><p>kg · 파운드 · 온스 즉시 변환</p></header>
  <div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8079614247767823" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle || []).push({});</script></div>
  <div class="calc-card">
    <div class="form-group">
      <label for="val">값 입력</label>
      <input type="number" id="val" placeholder="70" step="any">
    </div>
    <div class="form-group">
      <label for="from">변환 기준</label>
      <select id="from" onchange="convert()">
        <option value="kg" selected>킬로그램 (kg)</option>
        <option value="g">그램 (g)</option>
        <option value="mg">밀리그램 (mg)</option>
        <option value="t">톤 (t)</option>
        <option value="lb">파운드 (lb)</option>
        <option value="oz">온스 (oz)</option>
        <option value="st">스톤 (st)</option>
      </select>
    </div>
    <button class="btn" onclick="convert()">변환하기</button>
    <div class="result-box" id="result"></div>
  </div>
  <div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8079614247767823" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle || []).push({});</script></div>
  <div class="seo-content">
    <h2>무게 단위 변환표</h2>
    <ul><li>1 kg = 2.20462 파운드</li><li>1 파운드 = 453.592 g</li><li>1 온스 = 28.3495 g</li><li>1 스톤 = 6.35029 kg</li></ul>
  </div>
  <footer><p>SmartCalc.tools — 무료 단위 변환기</p></footer>
</div>
<script>
var toKg={kg:1,g:0.001,mg:0.000001,t:1000,lb:0.453592,oz:0.0283495,st:6.35029};
var names={kg:'kg',g:'g',mg:'mg',t:'톤',lb:'파운드',oz:'온스',st:'스톤'};
document.getElementById('val').addEventListener('input',convert);
function convert(){
  var v=parseFloat(document.getElementById('val').value);
  if(isNaN(v)){document.getElementById('result').innerHTML='';return;}
  var from=document.getElementById('from').value;
  var kg=v*toKg[from];
  var html='<div class="result-highlight">변환 결과</div>';
  Object.keys(toKg).forEach(function(u){
    if(u!==from){
      var r=kg/toKg[u];
      var d=r<0.01?r.toExponential(2):(r<100?r.toFixed(4):r.toLocaleString('ko-KR',{maximumFractionDigits:2}));
      html+='<div class="result-row"><span class="label">'+names[u]+'</span><span class="value">'+d+'</span></div>';
    }
  });
  document.getElementById('result').innerHTML=html;
  document.getElementById('result').classList.add('show');
}
</script>
</body>
</html>
